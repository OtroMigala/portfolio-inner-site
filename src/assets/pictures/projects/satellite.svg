<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- antenna -->
  <rect x="6" y="1" width="4" height="1" fill="#000"/>
  <rect x="7" y="2" width="2" height="1" fill="#000"/>
  <rect x="7" y="3" width="1" height="2" fill="#000"/>
  <!-- solar panels -->
  <rect x="0" y="6" width="5" height="5" fill="#000"/>
  <rect x="1" y="7" width="3" height="3" fill="#2f6fd0"/>
  <rect x="2" y="7" width="1" height="3" fill="#7fb2ff"/>
  <rect x="11" y="6" width="5" height="5" fill="#000"/>
  <rect x="12" y="7" width="3" height="3" fill="#2f6fd0"/>
  <rect x="13" y="7" width="1" height="3" fill="#7fb2ff"/>
  <rect x="5" y="8" width="1" height="1" fill="#000"/>
  <rect x="10" y="8" width="1" height="1" fill="#000"/>
  <!-- body -->
  <rect x="6" y="5" width="4" height="7" fill="#000"/>
  <rect x="7" y="6" width="2" height="5" fill="#d8d8d8"/>
  <rect x="7" y="6" width="1" height="1" fill="#fff"/>
  <rect x="7" y="9" width="2" height="1" fill="#e0a030"/>
  <!-- thruster -->
  <rect x="7" y="12" width="2" height="1" fill="#000"/>
  <rect x="7" y="13" width="2" height="1" fill="#e05020"/>
  <rect x="7" y="14" width="1" height="1" fill="#f0c040"/>
</svg>
